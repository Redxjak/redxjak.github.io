<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redxjak's Projects</title>
  <style>
    :root {
      --bg: #f4f7f6;
      --panel: #ffffff;
      --ink: #16211e;
      --muted: #5c6d67;
      --line: #cbd8d3;
      --accent: #157f6e;
      --accent-dark: #0d584c;
      --shadow: 0 18px 40px rgba(24, 43, 38, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(135deg, rgba(21, 127, 110, 0.12), transparent 36%),
        var(--bg);
      color: var(--ink);
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0;
    }

    header {
      padding-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .intro {
      max-width: 620px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .projects {
      display: grid;
      gap: 14px;
    }

    .project-link {
      display: grid;
      gap: 8px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
    }

    .project-link:hover,
    .project-link:focus-visible {
      border-color: var(--accent);
      outline: 3px solid rgba(21, 127, 110, 0.18);
      outline-offset: 2px;
    }

    .project-title {
      color: var(--accent-dark);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .project-description {
      color: var(--muted);
      line-height: 1.45;
    }

    footer {
      padding-top: 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Redxjak's Projects</h1>
      <p class="intro">A simple home base for tools and projects.</p>
    </header>

    <main class="projects" aria-label="Project links">
      <a class="project-link" href="./PWGen/">
        <span class="project-title">Password Generator</span>
        <span class="project-description">Generate passwords locally in your browser with no online password storage.</span>
      </a>
    </main>

    <footer>
      <span>More projects can be added here later.</span>
    </footer>
  </div>
</body>
</html>
